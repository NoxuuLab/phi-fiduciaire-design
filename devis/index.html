<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>PHI Fiduciaire — Générateur de devis (maquette v1.0)</title>
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <style>
        :root {
            --teal: #1b3f3f;
            --teal-mid: #2a5555;
            --teal-accent: #4a9a8a;
            --teal-light: #eaf3f1;
            --teal-xlight: #f4faf9;
            --gold: #D4AF37;
            --red: #ef3a24;
            --amber: #b45309;
            --info: #1d6fa4;
            --border: #d1e4e1;
            --border-focus: #4a9a8a;
            --text-primary: #1a2e2e;
            --text-secondary: #4a6565;
            --text-muted: #7a9898;
            --bg-page: #0d2626;
            --white: #fff;
            --radius: 10px;
            --radius-lg: 18px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background:
                linear-gradient(rgba(13,38,38,.72), rgba(13,38,38,.72)),
                url('img/wallpaper-login.jpg') center/cover fixed no-repeat;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 16px 48px;
        }
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            background: radial-gradient(circle, rgba(255,255,255,.08) 0%, transparent 70%);
        }
        body::before { width: 700px; height: 700px; top: -250px; left: -250px; }
        body::after { width: 600px; height: 600px; bottom: -200px; right: -200px; }

        [x-cloak] { display: none !important; }

        .progress-track {
            position: fixed; top: 0; left: 0; right: 0;
            height: 3px; background: rgba(255,255,255,.08); z-index: 100;
        }
        .progress-fill {
            height: 100%; background: var(--teal-accent);
            transition: width .4s cubic-bezier(.4,0,.2,1);
        }

        .app-shell { width: 100%; display: flex; flex-direction: column; align-items: center; }

        .card {
            background: var(--white);
            border-radius: var(--radius-lg);
            width: 580px;
            max-width: 100%;
            flex: none;
            padding: 36px 44px 32px;
            box-shadow: 0 32px 100px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.2);
        }

        .logo-wrap { text-align: center; margin-bottom: 16px; padding: 0 0 12px; background: var(--white); border-bottom: 1px solid var(--border); }
        .logo-inner { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
        .logo-img { width: 200px; height: auto; display: block; }

        .step-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .step-badge {
            font-size: 11px; font-weight: 700; color: var(--teal-accent);
            background: var(--teal-light); border-radius: 20px;
            padding: 4px 13px; letter-spacing: .05em;
        }
        .dots { display: flex; gap: 5px; }
        .dot { width: 22px; height: 4px; border-radius: 2px; background: var(--border); transition: background .3s; }
        .dot.done { background: var(--teal-accent); }
        .dot.active { background: var(--teal); }

        .q-title { font-size: 23px; font-weight: 700; color: var(--teal); margin-bottom: 6px; line-height: 1.2; }
        .q-sub { font-size: 13.5px; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.45; }
        .q-sub .opt { color: var(--text-muted); font-style: italic; }

        .sect-lbl {
            font-size: 10.5px; font-weight: 700; letter-spacing: .1em;
            color: var(--text-muted); text-transform: uppercase;
            margin: 16px 0 8px; display: flex; align-items: center; gap: 6px;
        }
        .sect-lbl .req { color: var(--red); font-size: 12px; }
        .sect-lbl .opt-tag { font-size: 10px; font-weight: 500; color: var(--text-muted); font-style: italic; letter-spacing: 0; text-transform: none; }

        .pill-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
        .pill {
            border: 1.5px solid var(--border); border-radius: var(--radius);
            padding: 10px 18px; cursor: pointer; font-size: 13.5px;
            font-weight: 500; color: var(--teal); background: white;
            transition: border-color .2s, background .15s;
            white-space: nowrap; text-align: center;
        }
        .pill:hover { border-color: var(--teal-accent); background: var(--teal-xlight); }
        .pill.selected { border-color: var(--teal); background: var(--teal-light); font-weight: 600; }
        .pill-sub { font-size: 11px; color: var(--text-muted); display: block; margin-top: 2px; font-weight: 400; }
        .pill.has-price .pill-sub { color: var(--amber); }

        .input-field {
            width: 100%; min-width: 0;
            border: 1.5px solid var(--border);
            border-radius: var(--radius); padding: 11px 14px;
            font-size: 15px; color: var(--text-primary);
            outline: none; transition: border-color .2s;
            font-family: inherit; background: white; margin-bottom: 4px;
        }
        .input-field:focus { border-color: var(--border-focus); }
        .input-field::placeholder { color: var(--text-muted); }
        .input-field.error { border-color: var(--red); }
        input[type=number] { -moz-appearance: textfield; }
        input[type=number]::-webkit-inner-spin-button { opacity: 0; }

        .chk-list { display: flex; flex-direction: column; gap: 8px; }
        .chk-item {
            border: 1.5px solid var(--border); border-radius: var(--radius);
            padding: 12px 16px; cursor: pointer;
            display: flex; align-items: flex-start; gap: 12px;
            background: white; transition: border-color .2s, background .15s;
            user-select: none;
        }
        .chk-item:hover { border-color: var(--teal-accent); background: var(--teal-xlight); }
        .chk-item.selected { border-color: var(--teal); background: var(--teal-light); }
        .chk-box {
            width: 18px; height: 18px; border-radius: 50%;
            border: 1.5px solid var(--border); background: white;
            flex-shrink: 0; margin-top: 1px;
            display: flex; align-items: center; justify-content: center;
            transition: all .15s;
        }
        .chk-item.selected .chk-box { background: var(--teal); border-color: var(--teal); }
        .chk-box-inner { width: 8px; height: 8px; border-radius: 50%; background: white; display: none; }
        .chk-item.selected .chk-box-inner { display: block; }
        .chk-name { font-size: 14px; font-weight: 600; color: var(--teal); line-height: 1.3; }
        .chk-desc { font-size: 12px; color: var(--text-muted); margin-top: 2px; line-height: 1.4; }

        .info-btn {
            width: 17px; height: 17px; border-radius: 50%;
            border: 1.5px solid var(--text-muted); background: none;
            cursor: pointer; font-size: 9px; font-weight: 700;
            color: var(--text-muted); display: inline-flex;
            align-items: center; justify-content: center;
            position: relative; flex-shrink: 0;
            transition: border-color .2s, color .2s;
            font-family: inherit; vertical-align: middle; margin-left: 4px;
        }
        .info-btn:hover, .info-btn:focus { border-color: var(--teal-accent); color: var(--teal-accent); outline: none; }
        .tooltip {
            display: none; position: absolute;
            bottom: calc(100% + 7px); left: 50%; transform: translateX(-50%);
            background: var(--teal); color: white;
            font-size: 11.5px; line-height: 1.5;
            padding: 8px 12px; border-radius: 8px;
            width: 240px; z-index: 20;
            font-weight: 400; text-align: left; pointer-events: none;
        }
        .tooltip::after {
            content: ''; position: absolute; top: 100%; left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent; border-top-color: var(--teal);
        }
        .info-btn:hover .tooltip, .info-btn:focus .tooltip { display: block; }

        .dyn {
            display: flex; align-items: flex-start; gap: 8px;
            margin-top: 10px; font-size: 12.5px; line-height: 1.5;
            opacity: 0; max-height: 0; overflow: hidden;
            transition: opacity .25s, max-height .3s;
            color: var(--gold);
        }
        .dyn.show { opacity: 1; max-height: 150px; }
        .dyn-icon { flex-shrink: 0; margin-top: 2px; }

        .opt-grid { display: grid; gap: 12px; }
        .opt-grid.c2 { grid-template-columns: 1fr 1fr; }
        .opt-grid.r2x2 { grid-template-columns: 1fr 1fr; }
        .opt-card {
            border: 1.5px solid var(--border); border-radius: var(--radius);
            padding: 20px 16px 16px; cursor: pointer;
            display: flex; flex-direction: column; align-items: center;
            gap: 10px; text-align: center; background: white;
            transition: border-color .2s, background .15s, transform .15s;
        }
        .opt-card:hover { border-color: var(--teal-accent); background: var(--teal-xlight); transform: translateY(-1px); }
        .opt-card.selected { border-color: var(--teal); background: var(--teal-light); }
        .opt-card-icon { color: var(--teal-accent); }
        .opt-card-name { font-size: 15px; font-weight: 700; color: var(--teal); }
        .opt-card-hint { font-size: 12px; color: var(--text-muted); line-height: 1.4; }

        .opt-row {
            border: 1.5px solid var(--border); border-radius: var(--radius);
            padding: 13px 16px; cursor: pointer;
            display: flex; align-items: center; gap: 11px;
            background: white; transition: border-color .2s, background .15s;
        }
        .opt-row:hover { border-color: var(--teal-accent); background: var(--teal-xlight); }
        .opt-row.selected { border-color: var(--teal); background: var(--teal-light); }
        .opt-row-icon { color: var(--teal-accent); flex-shrink: 0; }
        .opt-row-name { font-size: 14px; font-weight: 600; color: var(--teal); }

        .field-group { margin-bottom: 13px; width: 100%; }
        .field-group label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-primary); margin-bottom: 5px; }
        .field-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
        .phone-row { display: flex; gap: 8px; width: 100%; }
        .phone-prefix {
            flex-shrink: 0; width: 105px;
            border: 1.5px solid var(--border); border-radius: var(--radius);
            padding: 11px 10px; background: var(--teal-xlight);
            display: flex; align-items: center;
        }
        .phone-prefix select {
            background: none; border: none; outline: none;
            font-size: 13.5px; font-weight: 600; color: var(--teal);
            cursor: pointer; font-family: inherit; width: 100%;
        }

        .summary { background: var(--teal-xlight); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 18px; }
        .sum-row {
            display: flex; justify-content: space-between; align-items: baseline;
            gap: 10px; padding: 8px 0; font-size: 13px;
            color: var(--text-secondary);
            border-bottom: 1px solid rgba(27,63,63,.08);
        }
        .sum-row:last-of-type { border-bottom: none; }
        /* The label wraps and shrinks first; the amount never breaks or gets
           squeezed against it — without this, on narrow screens a long label
           plus its amount can fill the row with no space left between them
           (they render glued together, e.g. "annuelleCHF"). */
        .sum-row span { color: var(--teal); font-weight: 500; flex: 1 1 auto; min-width: 0; }
        .sum-row strong { color: var(--text-primary); font-weight: 600; flex-shrink: 0; white-space: nowrap; text-align: right; }
        .sum-total {
            display: flex; justify-content: space-between;
            align-items: baseline; padding: 12px 0 0;
            margin-top: 6px; border-top: 1.5px solid var(--teal-accent);
        }
        .sum-total-lbl { font-size: 13px; font-weight: 700; color: var(--teal); }
        .sum-price { font-size: 22px; font-weight: 800; color: var(--teal); white-space: nowrap; flex-shrink: 0; }
        .sum-total { gap: 12px; }
        .sum-total-lbl { min-width: 0; }
        .sum-price small { font-size: 13px; font-weight: 400; color: var(--text-muted); }
        .sum-note { font-size: 11px; color: var(--text-muted); margin-top: 7px; }

        .nav {
            display: flex; justify-content: space-between;
            align-items: center; margin-top: 24px;
            padding-top: 20px; border-top: 1px solid var(--border);
        }
        .btn-back {
            background: none; border: none;
            font-size: 13px; color: var(--text-muted);
            cursor: pointer; display: flex;
            align-items: center; gap: 5px;
            padding: 8px 0; font-family: inherit;
            transition: color .2s;
        }
        .btn-back:hover { color: var(--text-secondary); }
        .btn-back:focus-visible { outline: 2px solid var(--teal-accent); outline-offset: 2px; border-radius: 4px; }
        .btn-next {
            background: var(--teal); color: white;
            border: none; border-radius: var(--radius);
            padding: 12px 24px; font-size: 14px;
            font-weight: 600; cursor: pointer;
            display: flex; align-items: center; gap: 8px;
            font-family: inherit; transition: background .2s, opacity .2s;
        }
        .btn-next:hover:not(:disabled) { background: var(--teal-mid); }
        .btn-next:disabled { opacity: .35; cursor: not-allowed; }
        .btn-next:focus-visible { outline: 2px solid var(--teal-accent); outline-offset: 2px; }
        .btn-next.cta { background: var(--teal-accent); }
        .btn-next.cta:hover:not(:disabled) { background: #3a8a7a; }

        .branch-tag {
            display: inline-flex; align-items: center; gap: 5px;
            font-size: 11px; font-weight: 600; color: var(--teal-accent);
            background: var(--teal-light); border-radius: 20px;
            padding: 3px 10px; margin-bottom: 12px;
        }

        .confirm-icon {
            width: 60px; height: 60px; border-radius: 50%;
            background: var(--teal-light);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
        }

        .page-footer { margin-top: 20px; font-size: 11px; color: rgba(255,255,255,.22); text-align: center; }
        /* Maquette : remplace le widget Altcha (vérification anti-robot côté serveur) */
        .altcha-placeholder {
            margin-top: 14px; border: 1px solid #ddd; border-radius: 3px;
            padding: 12px 14px; font-size: 14px; color: #333;
            display: flex; align-items: center; gap: 10px; max-width: 260px;
        }
        .altcha-placeholder span { width: 18px; height: 18px; border: 2px solid var(--teal-accent); border-radius: 3px; background: var(--teal-accent); }

        .hp-field { position: absolute; opacity: 0; top: 0; left: 0; height: 0; width: 0; z-index: -1; }

        .err-msg { font-size: 12px; color: var(--red); margin-top: 4px; display: flex; align-items: center; gap: 4px; }

        .spinner {
            display: inline-block; width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,.3);
            border-radius: 50%; border-top-color: white;
            animation: spin .6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 540px) {
            .card { width: 100%; max-width: 100%; padding: 24px 20px; }
            .opt-grid.c2, .opt-grid.r2x2, .field-row2 { grid-template-columns: 1fr; }
            .pill-group { gap: 6px; }
        }
    </style>
</head>
<body>

<div class="app-shell" x-data="pricingForm()" x-cloak x-init="init()">

<!-- Progress Bar -->
<div class="progress-track">
    <div class="progress-fill" :style="`width: ${progressPercent}%`"></div>
</div>

<div class="card">

    <!-- Logo -->
    <div class="logo-wrap">
        <a href="https://dev.phi-fiduciaire.ch/" class="logo-inner">
            <img src="img/phi-fiduciare-logo.png" alt="PHI Fiduciaire" class="logo-img">
        </a>
    </div>

    <!-- Honeypot -->
    <input type="text" name="website" tabindex="-1" autocomplete="off"
           aria-hidden="true" x-model="honeypot" class="hp-field">

    <!-- ════════════════════════════════════════════════════════════════ -->
    <!-- STEP INDICATOR                                                    -->
    <!-- ════════════════════════════════════════════════════════════════ -->
    <template x-if="typeof step === 'number' && step > 0">
        <div class="step-hdr">
            <span class="step-badge" x-text="`Étape ${displayStep} / ${totalSteps}`"></span>
            <div class="dots">
                <template x-for="n in totalSteps" :key="n">
                    <div class="dot" :class="n < displayStep ? 'done' : n === displayStep ? 'active' : ''"></div>
                </template>
            </div>
        </div>
    </template>

    <!-- ════════════════════════════════════════════════════════════════ -->
    <!-- STEP 0 — Type de client                                           -->
    <!-- ════════════════════════════════════════════════════════════════ -->
    <template x-if="step === 0">
        <div>
            <h1 class="q-title">Type de client</h1>
            <div class="opt-grid c2" style="margin-top:10px;">
                <button type="button" class="opt-card" @click="selectClientType('moral')"
                        :class="clientType === 'moral' ? 'selected' : ''">
                    <div class="opt-card-icon">
                        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><line x1="12" y1="12" x2="12" y2="16"/><line x1="10" y1="14" x2="14" y2="14"/></svg>
                    </div>
                    <div class="opt-card-name">Personne morale</div>
                    <div class="opt-card-hint">Sàrl, SA, association, fondation</div>
                </button>
                <button type="button" class="opt-card" @click="selectClientType('physique')"
                        :class="clientType === 'physique' ? 'selected' : ''">
                    <div class="opt-card-icon">
                        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </div>
                    <div class="opt-card-name">Personne physique</div>
                    <div class="opt-card-hint">Particulier, indépendant</div>
                </button>
            </div>
            <div class="nav">
                <div></div>
                <button type="button" class="btn-next" @click="nextStep()" :disabled="!clientType">
                    Commencer →
                </button>
            </div>
        </div>
    </template>

    <!-- ════════════════════════════════════════════════════════════════ -->
    <!-- PERSONNE PHYSIQUE BRANCH                                          -->
    <!-- ════════════════════════════════════════════════════════════════ -->

    <!-- PP · STEP 1 — Situation personnelle -->
    <template x-if="clientType === 'physique' && step === 1">
        <div>
            <h1 class="q-title">Votre situation personnelle</h1>
            <p class="q-sub">Les éléments de base de votre dossier fiscal.</p>

            <div class="sect-lbl">État civil <span class="req">*</span></div>
            <div class="pill-group">
                <template x-for="opt in maritalOptions" :key="opt.value">
                    <button type="button" class="pill" @click="pp.marital_status = opt.value"
                            :class="pp.marital_status === opt.value ? 'selected' : ''"
                            x-text="opt.label"></button>
                </template>
            </div>

            <div class="dyn" :class="pp.marital_status === 'marie' ? 'show' : ''">
                <svg class="dyn-icon" width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6.25" stroke="currentColor" stroke-width="1.5"/><path d="M7 6v4M7 4.5v.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                <span>Déclaration commune : les revenus des deux conjoints sont consolidés.</span>
            </div>

            <div class="sect-lbl" style="margin-top:18px;">Enfants à charge <span class="opt-tag">(optionnel)</span></div>
            <input class="input-field" type="number" x-model="pp.children" min="0" step="1" placeholder="0"
                   @input="pp.children = normalizePositiveInt($event.target.value)" style="max-width:160px;">

            <div class="sect-lbl" style="margin-top:18px;">Canton de résidence <span class="req">*</span>
                <button type="button" class="info-btn" aria-label="Information canton">i
                    <span class="tooltip">Si votre canton n'est pas listé, choisissez "Autre" — nous adaptons le traitement à votre situation.</span>
                </button>
            </div>
            <div class="pill-group">
                <template x-for="opt in cantonOptions" :key="opt.value">
                    <button type="button" class="pill" @click="pp.canton = opt.value"
                            :class="pp.canton === opt.value ? 'selected' : ''"
                            x-text="opt.label"></button>
                </template>
            </div>

            <div class="nav">
                <button type="button" class="btn-back" @click="prevStep()">← Retour</button>
                <button type="button" class="btn-next" @click="nextStep()"
                        :disabled="!pp.marital_status || !pp.canton">Continuer →</button>
            </div>
        </div>
    </template>

    <!-- PP · STEP 10 — Situation internationale -->
    <template x-if="clientType === 'physique' && step === 10">
        <div>
            <h1 class="q-title">Situation internationale</h1>
            <p class="q-sub">Cochez les situations qui s'appliquent à votre cas. (optionnel)</p>

            <div class="chk-list">
                <template x-for="opt in visibleInternationalOptions" :key="opt.value">
                    <label class="chk-item" :class="pp.international.includes(opt.value) ? 'selected' : ''">
                        <div class="chk-box"><div class="chk-box-inner"></div></div>
                        <input type="checkbox" :value="opt.value" x-model="pp.international" class="sr-only" style="position:absolute;opacity:0;width:0;height:0;">
                        <div>
                            <div class="chk-name" x-text="opt.label"></div>
                        </div>
                    </label>
                </template>
            </div>

            <div class="dyn show">
                <svg class="dyn-icon" width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6.25" stroke="currentColor" stroke-width="1.5"/><path d="M7 6v4M7 4.5v.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                <span>Votre situation internationale sera prise en compte dans l'estimation de votre tarif.</span>
            </div>

            <div class="nav">
                <button type="button" class="btn-back" @click="prevStep()">← Retour</button>

            </div>
        </div>
    </template>

    <!-- PP · STEP 2 — Sources de revenus -->

                <template x-for="opt in incomeOptions.slice(0, 1)" :key="opt.value">
                    <label class="chk-item" :class="pp.income_sources.includes(opt.value) ? 'selected' : ''">

                        <input type="checkbox" :value="opt.value" x-model="pp.income_sources" @change="syncCertificatsDefault()" class="sr-only" style="position:absolute;opacity:0;width:0;height:0;">
                        <div>
                            <div class="chk-name" x-text="opt.label"></div>
                            <div class="chk-desc" x-show="opt.desc" x-text="opt.desc"></div>
                        </div>
                    </label>
                </template>

                <!-- Certificats de revenus — revealed under « Salaire » -->
                <div x-show="pp.income_sources.includes('salaire')" x-transition.opacity
                     style="margin-left:18px;border-left:3px solid var(--teal-accent);border-radius:0 var(--radius) var(--radius) 0;padding:10px 14px;background:var(--teal-xlight);margin-top:8px;">
                    <div class="sect-lbl" style="margin-top:0;">Certificats de revenus</div>
                    <input class="input-field" type="number" :min="ppCertificatsMin" step="1" placeholder="Ex. 1"
                           :value="pp.certificats"
                           @input="if ($event.target.value !== '') { pp.certificats = Math.max(ppCertificatsMin, normalizePositiveInt($event.target.value)); pp.certificats_edited = true; $event.target.value = pp.certificats; }"
                           @blur="pp.certificats = Math.max(ppCertificatsMin, Number(pp.certificats || 0)); $event.target.value = pp.certificats;"
                           style="max-width:160px;">
                    <p class="sum-note" style="margin-top:6px;">1 certificat est inclus dans le tarif de base.</p>
                </div>

                <!-- Activité indépendante — item with Comptabilité indépendante sub-section -->
                <label class="chk-item" :class="pp.income_sources.includes('activite_independante') ? 'selected' : ''">
                    <div class="chk-box"><div class="chk-box-inner"></div></div>
                    <input type="checkbox" value="activite_independante" x-model="pp.income_sources" class="sr-only" style="position:absolute;opacity:0;width:0;height:0;">
                    <div>
                        <div class="chk-name">Activité indépendante</div>
                        <div class="chk-desc">Inclut freelance, raison individuelle, profession libérale</div>
                    </div>
                </label>
                <div x-show="pp.income_sources.includes('activite_independante')" x-transition.opacity
                             style="margin-left:18px;border-left:3px solid var(--teal-accent);border-radius:0 var(--radius) var(--radius) 0;padding:10px 14px;background:var(--teal-xlight);margin-top:8px;">
                            <div style="font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px;">Votre activité indépendante</div>
                            <div class="sect-lbl" style="margin-top:0;">Nombre d'employés <span class="req">*</span></div>
                            <input class="input-field" type="number" x-model="pp.employees" min="0" step="1" placeholder="Ex. 3"
                                   @input="pp.employees = $event.target.value === '' ? '' : normalizePositiveInt($event.target.value);">
                            <div class="sect-lbl">Chiffre d'affaires annuel (CHF) <span class="req">*</span></div>
                            <div style="position:relative;">
                                <input class="input-field" type="text" inputmode="numeric"
                                       :value="ppRevenueDisplay" @input="formatPpRevenue($event)"
                                       placeholder="Ex. 250 000" style="padding-right:50px;">
                                <span style="position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:13px;font-weight:600;color:var(--text-muted);pointer-events:none;">CHF</span>
                            </div>
                            <template x-if="ppShowComptabiliteTransmission">
                                <div style="margin-top:16px;">
                                    <div class="sect-lbl" style="margin-top:0;">Transmission de votre comptabilité <span class="req">*</span></div>
                                    <p class="chk-desc" style="margin:-2px 0 10px;">Si vous nous remettez un fichier Excel déjà complété avec vos recettes et dépenses, choisissez « Fichier Excel préparé ». Sinon, choisissez « Documents à trier ».</p>
                                    <div class="chk-list">
                                        <template x-for="opt in comptabiliteOptions" :key="opt.value">
                                            <label class="chk-item" :class="pp.comptabilite_independante === opt.value ? 'selected' : ''"
                                                   @click="pp.comptabilite_independante = opt.value">
                                                <div class="chk-box"><div class="chk-box-inner"></div></div>
                                                <div class="chk-name" style="flex:1;" x-text="opt.label"></div>
                                                <button type="button" class="info-btn" @click.stop.prevent aria-label="Information" style="flex-shrink:0;">i
                                                    <span class="tooltip" x-text="opt.hint"></span>
                                                </button>
                                            </label>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                <template x-for="opt in incomeOptions.slice(2)" :key="opt.value">
                    <label class="chk-item" :class="pp.income_sources.includes(opt.value) ? 'selected' : ''">
                        <div class="chk-box"><div class="chk-box-inner"></div></div>
                        <input type="checkbox" :value="opt.value" x-model="pp.income_sources" class="sr-only" style="position:absolute;opacity:0;width:0;height:0;">
                        <div>
                            <div class="chk-name" x-text="opt.label"></div>
                            <div class="chk-desc" x-show="opt.desc" x-text="opt.desc"></div>
                        </div>
                    </label>
                </template>
            </div>

            <div class="nav">
                <button type="button" class="btn-back" @click="prevStep()">← Retour</button>
                <button type="button" class="btn-next" @click="nextStep()" :disabled="ppIndependentIncomplete">Continuer →</button>
            </div>
        </div>
    </template>

    <!-- PP · STEP 3 — Patrimoine -->
    <template x-if="clientType === 'physique' && step === 3">
        <div>
            <h1 class="q-title">Patrimoine à déclarer</h1>
            <p class="q-sub">Éléments impactant la complexité du traitement.</p>

            <div class="chk-list">
                <template x-for="opt in patrimoineOptions" :key="opt.value">
                    <div>
                    <label class="chk-item" :class="pp.patrimoine.includes(opt.value) ? 'selected' : ''">
                        <div class="chk-box"><div class="chk-box-inner"></div></div>
                        <input type="checkbox" :value="opt.value" x-model="pp.patrimoine" style="position:absolute;opacity:0;width:0;height:0;">
                        <div>
                            <div class="chk-name" x-text="opt.label"></div>
                            <div class="chk-desc" x-show="opt.desc" x-text="opt.desc"></div>
                        </div>
                    </label>
                    <div x-show="opt.value === 'participation_societe' && pp.patrimoine.includes('participation_societe')" x-transition.opacity
                         style="margin-left:18px;padding:10px 14px;">
                        <div class="sect-lbl" style="margin-top:0;">Nombre de sociétés</div>
                        <input class="input-field" type="number" min="1" step="1" placeholder="1"
                               :value="pp.participation_count"
                               @input="if ($event.target.value !== '') { pp.participation_count = Math.max(1, normalizePositiveInt($event.target.value)); $event.target.value = pp.participation_count; }"
                               @blur="pp.participation_count = Math.max(1, Number(pp.participation_count || 1)); $event.target.value = pp.participation_count;"
                               style="max-width:160px;">
                    </div>
                    </div>
                </template>
            </div>

            <div class="nav">
                <button type="button" class="btn-back" @click="prevStep()">← Retour</button>
                <button type="button" class="btn-next" @click="nextStep()">Continuer →</button>
            </div>
        </div>
    </template>

    <!-- PP · STEP 4 — Éléments particuliers -->
    <template x-if="clientType === 'physique' && step === 4">
        <div>
            <h1 class="q-title">Éléments particuliers</h1>
            <p class="q-sub">Situations influençant le temps de traitement.</p>

            <div class="chk-list">
                <template x-for="opt in elementsParticuliersOptions" :key="opt.value">
                    <label class="chk-item" :class="pp.elements_particuliers.includes(opt.value) ? 'selected' : ''">
                        <div class="chk-box"><div class="chk-box-inner"></div></div>
                        <input type="checkbox" :value="opt.value" x-model="pp.elements_particuliers" style="position:absolute;opacity:0;width:0;height:0;">
                        <div>
                            <div class="chk-name" x-text="opt.label"></div>
                            <div class="chk-desc" x-show="opt.desc" x-text="opt.desc"></div>
                        </div>
                    </label>
                </template>
            </div>

            <div style="margin-top:28px;padding-top:20px;border-top:1px solid var(--border);">
                <div class="sect-lbl" style="margin-top:0;">Préparation des documents <span class="req">*</span></div>
                <div class="pill-group">
                    <template x-for="opt in docsStateOptions" :key="opt.value">
                        <button type="button" class="pill" @click="pp.docs_state = opt.value"
                                :class="pp.docs_state === opt.value ? 'selected' : ''">
                            <span x-text="opt.label"></span>
                        </button>
                    </template>
                </div>
            </div>

            <div class="dyn" :class="pp.docs_state === 'desordre' ? 'show' : ''">
                <svg class="dyn-icon" width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6.25" stroke="currentColor" stroke-width="1.5"/><path d="M7 6v4M7 4.5v.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                <span>Un forfait de tri de CHF 60 s'ajoute pour les dossiers non triés.</span>
            </div>

            <div class="nav">
                <button type="button" class="btn-back" @click="prevStep()">← Retour</button>
                <button type="button" class="btn-next" @click="nextStep()">Continuer →</button>
            </div>
        </div>
    </template>

    <!-- PP · STEP 5 — Coordonnées -->
    <template x-if="clientType === 'physique' && step === 5">
        <div>
            <h1 class="q-title">Vos coordonnées</h1>
            <p class="q-sub">Pour recevoir votre estimation et être contacté par notre équipe.</p>

            <div class="field-row2">
                <div class="field-group">
                    <label>Prénom <span style="color:var(--red);">*</span></label>
                    <input class="input-field" type="text" x-model="pp.name.first_name" placeholder="Jean">
                </div>
                <div class="field-group">
                    <label>Nom <span style="color:var(--red);">*</span></label>
                    <input class="input-field" type="text" x-model="pp.name.last_name" placeholder="Dupont">
                </div>
            </div>
            <div class="field-group">
                <label>Email <span style="color:var(--red);">*</span></label>
                <input class="input-field" type="email" x-model="pp.email" placeholder="jean@example.com"
                       :class="pp.email && !isValidEmail(pp.email) ? 'error' : ''">
                <div class="err-msg" x-show="pp.email && !isValidEmail(pp.email)">Adresse e-mail invalide.</div>
            </div>
            <div class="field-group">
                <label>Téléphone <span style="color:var(--red);">*</span>
                    <button type="button" class="info-btn" aria-label="Information téléphone">i
                        <span class="tooltip">Pour les numéros suisses, ne saisissez pas le 0 initial de l'indicatif cantonal ou mobile. Le préfixe pays est déjà ajouté automatiquement.</span>
                    </button>
                </label>
                <div class="phone-row">
                    <div class="phone-prefix">
                        <select x-model="ppPhoneCountry">
                            <template x-for="c in phoneCountries" :key="c.code">
                                <option :value="c.code" x-text="c.flag + ' ' + c.code"></option>
                            </template>
                        </select>
                    </div>
                    <input class="input-field" type="tel" x-model="pp.name.phone" placeholder="XX XXX XX XX"
                           @input="formatPhoneNumber($event, ['pp', 'name'])"
                           :class="pp.name.phone && !isValidPhone(pp.name.phone) ? 'error' : ''" style="flex:1;">
                </div>
                <div class="err-msg" x-show="pp.name.phone && !isValidPhone(pp.name.phone)">Numéro invalide (min. 7 chiffres).</div>
            </div>

            <div class="field-group">
                <label>Message <span style="color:var(--text-muted);font-weight:500;">(optionnel)</span></label>
                <textarea class="input-field" x-model="pp.message" rows="4" placeholder="Ajoutez un message si vous le souhaitez"></textarea>
            </div>

            <div class="err-msg" x-show="formError" style="margin-top:8px;" x-text="formError"></div>

            <div class="nav">
                <button type="button" class="btn-back" @click="prevStep()">← Retour</button>
                <button type="button" class="btn-next" @click="nextStep()"
                        :disabled="!pp.name.first_name || !pp.name.last_name || !pp.email || !isValidEmail(pp.email) || !pp.name.phone || !isValidPhone(pp.name.phone)">
                    Vérifier mes informations →
                </button>
            </div>
        </div>
    </template>

    <!-- PP · STEP 6 — Récapitulatif -->
    <template x-if="clientType === 'physique' && step === 6">
        <div>
            <h1 class="q-title">Votre estimation</h1>
            <p class="q-sub">Récapitulatif basé sur vos réponses — sans engagement.</p>

            <div class="summary">
                <template x-if="ppPreviewLoading || (!ppPreview && !ppPreviewError)">
                    <p class="sum-note">Calcul de votre estimation…</p>
                </template>
                <template x-if="ppPreviewError">
                    <p class="sum-note" x-text="ppPreviewError"></p>
                </template>
                <template x-if="ppPreview && ppPreview.independent && ppPreview.independent.status !== 'AUTO_PRICED'">
                    <div style="text-align:center;padding:12px 0;">
                        <strong style="display:block;font-size:16px;color:var(--teal);">Devis personnalisé</strong>
                        <p class="sum-note" style="margin-top:10px;">Votre demande nécessite une analyse complémentaire pour établir un devis.</p>
                        <p class="sum-note" style="margin-top:10px;">Vous recevrez un e-mail de confirmation auquel vous pourrez répondre pour nous transmettre les précisions utiles à sa préparation.</p>
                    </div>
                </template>
                <template x-if="ppPreview && !(ppPreview.independent && ppPreview.independent.status !== 'AUTO_PRICED')">
                    <div>
                        <template x-for="line in ppPreview.breakdown" :key="line.label">
                            <div class="sum-row">
                                <span x-html="labelWithParenBreak(line.label)"></span>
                                <strong x-text="'CHF ' + formatChf(line.price) + '/an'"></strong>
                            </div>
                        </template>
                        <template x-if="ppPreview.independent">
                            <div>
                                <div class="sum-row">
                                    <span x-html="labelWithParenBreak(ppPreview.independent.gc_label || 'Comptabilité et clôture annuelle – Activité indépendante')"></span>
                                    <strong x-text="'CHF ' + formatChf(ppPreview.independent.gc_annual) + '/an'"></strong>
                                </div>
                            </div>
                        </template>
                        <div class="sum-total">
                            <span class="sum-total-lbl" x-text="ppPreview.headline.recurring ? 'Estimation annuelle' : 'Estimation pour cette déclaration'"></span>
                            <span class="sum-price"><span x-text="'CHF ' + formatChf(ppPreview.headline.amount)"></span> <small x-text="ppPreview.headline.recurring ? 'HT/an' : 'HT'"></small></span>
                        </div>
                    </div>
                </template>
            </div>

            <div class="altcha-placeholder"><span></span>Je ne suis pas un robot</div>

            <div class="err-msg" x-show="formError" style="margin-top:8px;" x-text="formError"></div>

            <div class="nav">
                <button type="button" class="btn-back" @click="prevStep()">← Retour</button>
                <button type="button" class="btn-next cta" @click="submitIndividual()" :disabled="submitting || !altchaToken">
                    <template x-if="submitting"><span class="spinner"></span></template>
                    <span x-text="submitting ? 'Envoi en cours…' : ((ppPreview && ppPreview.independent && ppPreview.independent.status !== 'AUTO_PRICED') ? 'Envoyer ma demande →' : 'Recevoir le devis →')"></span>
                </button>
            </div>
        </div>
    </template>

    <!-- ════════════════════════════════════════════════════════════════ -->

        <div>

            <div style="margin-bottom:18px;"></div>

                <template x-for="opt in structureOptions" :key="opt.value">
                    <button type="button" class="opt-row" @click="fields.structure = opt.value"
                            :class="fields.structure === opt.value ? 'selected' : ''">
                        <div class="opt-row-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" x-html="structureIcon(opt.icon)"></svg>
                        </div>
                        <span class="opt-row-name" x-text="opt.label"></span>
                    </button>
                </template>

            </div>
        </div>
    </template>

                            <svg x-show="opt.value === 'creation-sarl'" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                                <g><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></g>
                            </svg>
                            <svg x-show="opt.value === 'creation-sa'" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">

                <span x-text="creationCapitalText()"></span>
            </div>
            <div class="nav">

            </div>
        </div>
    </template>

                                </div>

                                    <div class="chk-name" x-text="opt.label"></div>
                                    <div class="chk-desc" x-show="opt.desc" x-text="opt.desc"></div>
                                </div>
                            </label>
                        </template>
                    </div>
                </div>

            <div class="nav">

                                    <div class="chk-name" x-text="opt.label"></div>

    const FISCALITE_CODES = ['fiscalite-declarations-fiscales', 'fiscalite'];
    const TVA_CODES = ['declarations-tva', 'vat_declarations', 'subject_to_vat', 'tva'];
    const RH_CODES = ['gestion-rh-fiches-de-salaires', 'gestion-rh', 'rh'];
    const DOMICILIATION_CODES = ['domiciliation', 'domicilitiation'];
    const ADMINISTRATEUR_CODES = ['administrateur', 'administrative_director', 'admin'];

    // ─── Constantes de IndividualPricingService.php ───────────────────
    const PP_PRICES = {
        base_ge: 350, base_vd: 280, base_other: 260,
        adder_marital_married: 30, adder_child: 20, adder_intl_flat: 80,
        adder_cert_2_3: 20, adder_cert_4_plus: 50,
        adder_wealth_securities: 100, adder_wealth_swiss_property: 90,
        adder_wealth_crypto: 100, adder_wealth_company_stake: 40, adder_wealth_3rd_pillar: 20,
        adder_extra_multiple_properties: 150, adder_extra_succession: 200, adder_extra_unsorted_docs: 60,
    };
    const INDEPENDENT_LOW_REVENUE_THRESHOLD = 100000;
    const INDEPENDENT_GC_FALLBACK = 3600;
    // v1.0 : forfait sous 100'000 de CA (au lieu de 240 / 960 sans forfait)
    const INDEPENDENT_FORFAIT = 1250;
    const INDEPENDENT_EXCEL = 260;
    const INDEPENDENT_DOCUMENTS = 1040;

    // ─── Constantes de TransformationPricingService.php ───────────────
    const TRANSFORMATION_LABELS = { 'ri-sarl': 'RI → Sàrl', 'ri-sa': 'RI → SA', 'sarl-sa': 'Sàrl → SA' };
    const FIXED_OFFERS = {
        'sarl-sa': { price: 8500, min: 5500, max: 8500 },
        'ri-sarl': { price: 7500, min: 1800, max: 7500 },
        'ri-sa':   { price: 8500, min: 2200, max: 8500 },
    };

    // ─── Helpers ───────────────────────────────────────────────────────
    const round2 = n => Math.round(n * 100) / 100;
    const selected = (services, codes) => codes.some(c => services.includes(c));
    const thousands = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, "'");

    function interpolatedBasePrice(revenue) {
        const first = REVENUE_TIERS[0], last = REVENUE_TIERS[REVENUE_TIERS.length - 1];
        if (revenue <= first[0]) return first[1];
        if (revenue >= last[0]) return last[1];
        for (let i = 0; i < REVENUE_TIERS.length - 1; i++) {
            const [r1, p1] = REVENUE_TIERS[i], [r2, p2] = REVENUE_TIERS[i + 1];
            if (revenue > r1 && revenue <= r2) return round2(p1 + (p2 - p1) * (revenue - r1) / (r2 - r1));
        }
        return last[1];
    }

    // v1.0 : multiplicateur toujours appliqué (le code d'Adrien ne l'appliquait qu'avec Gestion RH)
    function accountingMatrixPrice(revenue, employees) {
        return Math.round(interpolatedBasePrice(revenue) * Math.pow(EMPLOYEE_MULTIPLIER, employees));
    }

    // Garde-fous v1.0, communs Sàrl/SA et indépendant. Exceptions d'Adrien conservées :
    // pas de plancher avec 0 employé, pas de plafond si CA ≤ 200'000.
    // Comparaisons en entiers pour que 1,5 % et 5 % pile tombent juste.
    // maxBase : montant comparé au plafond quand il diffère du plancher (indépendant : + déclaration fiscale).
    function guardrailStatus(ratioBase, revenue, employees, maxBase = ratioBase) {
        if (employees !== 0 && ratioBase * 1000 < revenue * GUARDRAIL_MIN_PERCENT * 10) {
            return { status: 'NOT_INTERESTING', reason: 'guardrail_min' };
        }
        if (revenue > EXCEPTION_LOW_REVENUE_THRESHOLD && maxBase * 100 >= revenue * GUARDRAIL_MAX_PERCENT) {
            return { status: 'ON_QUOTE', reason: 'guardrail_max' };
        }
        return { status: 'AUTO_PRICED', reason: null };
    }

    function rhLine(employees, rhSelected, comptaLineApplies) {
        if (!rhSelected || employees <= 0) return null;
        const count = `${employees} employé${employees > 1 ? 's' : ''}`;
        if (!comptaLineApplies) {
            return { label: `${RH_LINE_LABEL} (${count} inclus)`, amount: employees * RH_MONTHLY_RATE_PER_EMPLOYEE * 12, is_sole_service: true };
        }
        if (employees <= RH_FREE_EMPLOYEES_THRESHOLD) {
            return { label: `${RH_LINE_LABEL} (${count} inclus)`, amount: 0, is_sole_service: false };
        }
        return { label: `${RH_LINE_LABEL} (${count})`, amount: employees * RH_MONTHLY_RATE_PER_EMPLOYEE * 12, is_sole_service: false };
    }

    // ─── Société existante (Sàrl / SA) ─────────────────────────────────
    function existingCompany({ services = [], employees = 0, annualRevenue = 0 }) {
        const revenue = Number(annualRevenue) || 0;
        employees = Math.max(0, parseInt(employees, 10) || 0);
        const r = {
            status: 'AUTO_PRICED', on_quote_reason: null, base_price: 0, employee_multiplier: 1,
            calculated_price: 0, ratio_base: 0, percentage_of_revenue: 0,
            domiciliation_fee: 0, administrateur_fee: 0, fiscalite_supplement: 0, tva_supplement: 0,
            rh_line: null, comptabilite_label: '', annual_total: 0, monthly_total: 0,
        };

        if (revenue > MAX_AUTO_REVENUE) return { ...r, status: 'ON_QUOTE', on_quote_reason: 'revenue' };
        if (employees > MAX_AUTO_EMPLOYEES) return { ...r, status: 'ON_QUOTE', on_quote_reason: 'employees' };

        const compta = selected(services, COMPTABILITE_CODES);
        const fiscalite = selected(services, FISCALITE_CODES);
        const tva = selected(services, TVA_CODES);
        const rh = selected(services, RH_CODES);

        r.base_price = interpolatedBasePrice(revenue);
        r.employee_multiplier = Math.pow(EMPLOYEE_MULTIPLIER, employees);     // v1.0 : toujours
        r.calculated_price = accountingMatrixPrice(revenue, employees);

        const comptaLineApplies = compta || fiscalite || tva;
        r.comptabilite_label = compta ? 'Comptabilité & Clôture annuelle'
            : (fiscalite || tva) ? 'Contrôle & Clôture annuelle*' : '';
        if (!comptaLineApplies) r.calculated_price = 0;

        r.fiscalite_supplement = fiscalite
            ? (revenue >= FISCALITE_REVENUE_THRESHOLD ? FISCALITE_SUPPLEMENT_HIGH : FISCALITE_SUPPLEMENT_LOW) : 0;
        r.tva_supplement = tva ? TVA_SUPPLEMENT_ANNUAL : 0;
        r.rh_line = rhLine(employees, rh, comptaLineApplies);

        // v1.0 : le ratio prend les services récurrents (comptabilité, fiscalité, TVA, RH)
        r.ratio_base = r.calculated_price + r.fiscalite_supplement + r.tva_supplement + (r.rh_line ? r.rh_line.amount : 0);
        r.percentage_of_revenue = revenue > 0 ? round2(r.ratio_base / revenue * 100) : 0;

        // Comme chez Adrien : pas de garde-fou sans ligne matrice (ex. RH seule, domiciliation seule)
        if (comptaLineApplies) {
            const g = guardrailStatus(r.ratio_base, revenue, employees);
            r.status = g.status;
            r.on_quote_reason = g.reason;
        }

        if (selected(services, DOMICILIATION_CODES)) r.domiciliation_fee = DOMICILIATION_FEE_ANNUAL;
        if (selected(services, ADMINISTRATEUR_CODES)) r.administrateur_fee = ADMINISTRATEUR_FEE_ANNUAL;

        if (!comptaLineApplies && rh && employees <= 0) {
            r.status = 'ON_QUOTE';
            r.on_quote_reason = 'rh_without_employees';
        }

        r.annual_total = r.calculated_price + r.domiciliation_fee + r.administrateur_fee
            + r.fiscalite_supplement + r.tva_supplement + (r.rh_line ? r.rh_line.amount : 0);
        r.monthly_total = round2(r.annual_total / 12);
        return r;
    }

    // ─── Création de société ───────────────────────────────────────────
    function creation({ creation_type = '', situations = [], services = [] }) {
        const form = creation_type === 'creation-sa' ? 'SA' : 'Sàrl';
        const coordination = CREATION_COORDINATION[creation_type] || 0;
        const details = [
            { enterprise: 'Coordination de la création ' + form, price: coordination },
            { enterprise: 'Frais de notaire', price: NOTAIRE_FEE },
            { enterprise: 'Frais du Registre du commerce', price: RC_FEE },
        ];
        let nonRecurringTotal = coordination + NOTAIRE_FEE + RC_FEE;

        const complementary = [
            ['tva', 'Immatriculation TVA', TVA_ADDER],
            ['etranger', "Activité à l'étranger", ETRANGER_ADDER],
            ['holding', 'Structure holding', HOLDING_ADDER],
        ];
        for (const [code, label, price] of complementary) {
            if (!situations.includes(code)) continue;
            details.push({ enterprise: label, price });
            nonRecurringTotal += price;
        }

        let recurringTotal = 0;
        for (const code of services) {
            // Noms : celui de la table service pour la domiciliation ; le code « administrateur »
            // n'existe pas en base, d'où le libellé de repli du code d'Adrien.
            if (DOMICILIATION_CODES.includes(code)) {
                details.push({ service: 'Domiciliation et gestion du courrier', price: DOMICILIATION_FEE_ANNUAL, periodicity: 'annual' });
                recurringTotal += DOMICILIATION_FEE_ANNUAL;
            } else if (ADMINISTRATEUR_CODES.includes(code)) {
                details.push({ service: 'Administrateur de société', price: ADMINISTRATEUR_FEE_ANNUAL, periodicity: 'annual' });
                recurringTotal += ADMINISTRATEUR_FEE_ANNUAL;
            }
        }

        const vat = round2(nonRecurringTotal * CREATION_VAT_RATE / 100);
        return {
            total: nonRecurringTotal,
            non_recurring_total: nonRecurringTotal,
            vat_rate: CREATION_VAT_RATE,
            non_recurring_vat: vat,
            non_recurring_total_ttc: round2(nonRecurringTotal + vat),
            recurring_total: recurringTotal,
            recurring_annual_total: recurringTotal,
            details,
        };
    }

    // ─── Transformation (fourchettes inchangées en v1.0) ──────────────
    function transformation({ transformation_type = 'ri-sarl' }) {
        const offer = FIXED_OFFERS[transformation_type] || { price: 0, min: 0, max: 0 };
        const vat = round2(offer.price * CREATION_VAT_RATE / 100);
        return {
            transformation_type,
            label: TRANSFORMATION_LABELS[transformation_type] || transformation_type,
            total: offer.price,
            vat,
            total_ttc: round2(offer.price + vat),
            range_min: offer.min,
            range_max: offer.max,
            range: offer.price > 0 ? `CHF ${thousands(offer.min)}.– à CHF ${thousands(offer.max)}.–` : 'Sur devis',
        };
    }

    // ─── Activité indépendante ─────────────────────────────────────────
    function independentAccounting(revenue, employees, compMode, taxDeclaration) {
        if (revenue < INDEPENDENT_LOW_REVENUE_THRESHOLD) {
            // v1.0 : forfait + mode de transmission, sans garde-fou de ratio.
            // Comme chez Adrien : plus de 20 employés → devis personnalisé, même sous 100'000.
            const tooManyEmployees = employees > MAX_AUTO_EMPLOYEES;
            return {
                fee: INDEPENDENT_FORFAIT + (compMode === 'documents_trier' ? INDEPENDENT_DOCUMENTS : INDEPENDENT_EXCEL),
                label: 'Comptabilité & Clôture annuelle (1 exercice - '
                    + (compMode === 'documents_trier' ? 'Documents à trier' : 'Fichier Excel préparé') + ')',
                status: tooManyEmployees ? 'ON_QUOTE' : 'AUTO_PRICED', reason: tooManyEmployees ? 'employees' : null,
            };
        }
        // v1.0 : mêmes garde-fous que Sàrl/SA. Comme le code d'Adrien (décision du 28.10.2026) :
        // plancher sur la comptabilité seule, plafond sur comptabilité + déclaration fiscale.
        // Comme chez Adrien, la ligne comptabilité est toujours calculée et tout cas hors limites
        // passe en devis personnalisé (ON_QUOTE).
        const fee = accountingMatrixPrice(revenue, employees) || INDEPENDENT_GC_FALLBACK;
        if (revenue > MAX_AUTO_REVENUE) return { fee, label: null, status: 'ON_QUOTE', reason: 'revenue' };
        if (employees > MAX_AUTO_EMPLOYEES) return { fee, label: null, status: 'ON_QUOTE', reason: 'employees' };
        const g = guardrailStatus(fee, revenue, employees, fee + taxDeclaration);
        return { fee, label: null, status: g.status === 'AUTO_PRICED' ? 'AUTO_PRICED' : 'ON_QUOTE', reason: g.reason };
    }

    // ─── Personne physique ─────────────────────────────────────────────
    function individual(d) {
        const breakdown = [];
        const line = (label, price, category) => breakdown.push({ label, price, category });

        const canton = d.canton || 'OTHER';
        let intl = Array.isArray(d.international) ? d.international : [];
        if (canton !== 'OTHER') intl = intl.filter(v => v !== 'frontalier');
        const isFrontalier = intl.includes('frontalier');

        const base = { GE: ['base_ge', 'GE'], VD: ['base_vd', 'VD'] }[canton] || ['base_other', isFrontalier ? 'Frontalier' : ''];
        line('Base déclaration fiscale' + (base[1] ? ' (' + base[1] + ')' : ''), PP_PRICES[base[0]], 'base');

        if ((d.marital_status || 'celibataire') === 'marie') line('Marié(e) / Couple', PP_PRICES.adder_marital_married, 'marital');

        const children = Math.max(0, parseInt(d.children, 10) || 0);
        if (children > 0) line(children === 1 ? 'Enfant à charge' : children + ' enfants à charge', PP_PRICES.adder_child * children, 'family');

        if (intl.some(v => ['frontalier', 'revenus_etrangers', 'immobilier_etranger'].includes(v))) {
            line('Situation internationale', PP_PRICES.adder_intl_flat, 'international');
        }

        const incomes = Array.isArray(d.income_sources) ? d.income_sources : [];
        const certs = Math.max(incomes.includes('salaire') ? 1 : 0, parseInt(d.certificats, 10) || 0);
        if (certs >= 2) line('Certificats de revenus (' + certs + ')', certs >= 4 ? PP_PRICES.adder_cert_4_plus : PP_PRICES.adder_cert_2_3, 'income');

        const patrimoine = Array.isArray(d.patrimoine) ? d.patrimoine : [];
        const patrimoineMap = [
            ['portefeuille_titres', 'adder_wealth_securities', 'Portefeuille de titres'],
            ['immobilier_suisse', 'adder_wealth_swiss_property', 'Immobilier en Suisse'],
            ['immobilier_etranger', 'adder_wealth_foreign_property', "Immobilier à l'étranger"], // clé absente → 0, comme chez Adrien
            ['cryptomonnaies', 'adder_wealth_crypto', 'Cryptomonnaies'],
            ['troisieme_pilier', 'adder_wealth_3rd_pillar', '3ème pilier'],
        ];
        for (const [flag, key, label] of patrimoineMap) {
            if (patrimoine.includes(flag)) line(label, PP_PRICES[key] || 0, 'patrimoine');
        }
        if (patrimoine.includes('participation_societe')) {
            const n = Math.max(1, parseInt(d.participation_count, 10) || 1);
            line('Participation dans une société (' + n + ')', PP_PRICES.adder_wealth_company_stake * n, 'patrimoine');
        }

        const extras = Array.isArray(d.elements_particuliers) ? d.elements_particuliers : [];
        if (extras.includes('plusieurs_immeubles')) line('Plusieurs immeubles', PP_PRICES.adder_extra_multiple_properties, 'extras');
        if (extras.includes('succession_heritage')) line('Succession/héritage', PP_PRICES.adder_extra_succession, 'extras');

        if ((d.docs_state || 'complet') === 'desordre') line('Documents en désordre', PP_PRICES.adder_extra_unsorted_docs, 'extras');

        const total = round2(breakdown.reduce((s, l) => s + l.price, 0));

        let independent = null;
        if (incomes.includes('activite_independante')) {
            const employees = Math.max(0, parseInt(d.employees, 10) || 0);
            const revenue = Math.max(0, Number(d.annual_revenue) || 0);
            const acc = independentAccounting(revenue, employees, d.comptabilite_independante || 'preparee', total);
            independent = {
                gc_annual: acc.fee,
                gc_label: acc.label,
                tax_declaration: total,
                subtotal: round2(acc.fee + total),
                employees,
                annual_revenue: revenue,
                status: acc.status,              // v1.0 : hors garde-fous → devis personnalisé
                on_quote_reason: acc.reason,
            };
        }

        return {
            breakdown,
            independent,
            total,
            headline: { amount: independent ? independent.subtotal : total, recurring: independent !== null },
        };
    }

    return { existingCompany, creation, transformation, individual, interpolatedBasePrice, accountingMatrixPrice };
})();

</script>
