        ],
        // Services de legal_service, dans l'ordre de LegalServiceModel::getServicesForStructure
        servicesByStructure: {"sarl": [{"value": "administrative_director", "label": "Mandat d'administrateur", "price": 7500, "detail": "7'500 CHF", "desc": "PHI Fiduciaire agit comme administrateur légal de votre société"}, {"value": "comptabilite-cloture-annuelle", "label": "Comptabilité & Clôture annuelle", "price": 250, "detail": "250 CHF", "desc": ""}, {"value": "fiscalite-declarations-fiscales", "label": "Fiscalité & Déclarations fiscales", "price": 190, "detail": "190 CHF", "desc": ""}, {"value": "gestion-rh-fiches-de-salaires", "label": "Gestion RH & Fiches de salaires", "price": 600, "detail": "600 CHF", "desc": ""}, {"value": "vat_declarations", "label": "Déclarations TVA", "price": 160, "detail": "160 CHF", "desc": "Obligatoire dès CHF 100 000 de chiffre d'affaires annuel"}, {"value": "domiciliation", "label": "Domiciliation et gestion du courrier", "price": 250, "detail": "250 CHF", "desc": "Adresse officielle + réception et scan du courrier entrant"}], "sa": [{"value": "administrative_director", "label": "Mandat d'administrateur", "price": 7500, "detail": "7'500 CHF", "desc": "PHI Fiduciaire agit comme administrateur légal de votre société"}, {"value": "comptabilite-cloture-annuelle", "label": "Comptabilité & Clôture annuelle", "price": 250, "detail": "250 CHF", "desc": ""}, {"value": "fiscalite-declarations-fiscales", "label": "Fiscalité & Déclarations fiscales", "price": 190, "detail": "190 CHF", "desc": ""}, {"value": "gestion-rh-fiches-de-salaires", "label": "Gestion RH & Fiches de salaires", "price": 600, "detail": "600 CHF", "desc": ""}, {"value": "vat_declarations", "label": "Déclarations TVA", "price": 160, "detail": "160 CHF", "desc": "Obligatoire dès CHF 100 000 de chiffre d'affaires annuel"}, {"value": "domiciliation", "label": "Domiciliation et gestion du courrier", "price": 250, "detail": "250 CHF", "desc": "Adresse officielle + réception et scan du courrier entrant"}]},

        // ─── Computed ───────────────────────────────────────────────────
        get isCreation() { return this.fields.structure === 'creation'; },
        get isTransformation() { return this.fields.structure === 'transformation'; },

        get currentServiceOptions() {
            return this.servicesByStructure[this.fields.structure] ?? [];
        },

        // Codes mirroring PricingService::RH_SERVICE_CODES. "Gestion RH seule"
        // is billed per employee from the first one, so it needs at least one.
        rhServiceCodes: ['gestion-rh-fiches-de-salaires', 'gestion-rh', 'rh'],
        get isRhSelected() {
            return this.fields.services.some(v => this.rhServiceCodes.includes(v));
        },
        get isRhOnlySelection() {
            const selected = this.fields.services;
            return selected.length > 0
                && selected.every(v => this.rhServiceCodes.includes(v));
        },
        get requiresAtLeastOneEmployee() {
            return !this.isCreation && !this.isTransformation && this.isRhOnlySelection;
        },

        get structureLabel() {
            const opt = this.structureOptions.find(o => o.value === this.fields.structure);
            return opt ? opt.label : this.fields.structure;
        },
        get creationTypeLabel() {
            const opt = this.creationTypeOptions.find(o => o.value === this.fields.creation_type);
            return opt ? opt.label : this.fields.creation_type;
        },
        get transformationLabel() {
            const opt = this.transformationTypeOptions.find(o => o.value === this.fields.transformation_type);
            return opt ? opt.label : this.fields.transformation_type;
        },
        get ppMaritalLabel() {
            const opt = this.maritalOptions.find(o => o.value === this.pp.marital_status);
            return opt ? opt.label : '—';
        },
        get ppIncomeLabels() {
            return this.pp.income_sources.map(v => {
                const opt = this.incomeOptions.find(o => o.value === v);
                return opt ? opt.label : v;
            });
        },
        // "Frontalier" only applies when the canton of residence is "Autre".
        get visibleInternationalOptions() {
            return this.internationalOptions.filter(o => o.value !== 'frontalier' || this.pp.canton === 'OTHER');
        },
        get ppInternational() {
            return this.pp.international.filter(v => v !== 'frontalier' || this.pp.canton === 'OTHER');
        },
        get ppInternationalLabels() {
            return this.ppInternational.map(v => {
                const opt = this.internationalOptions.find(o => o.value === v);
                return opt ? opt.label : v;
            });
        },
        get ppCertificatsLabel() {
            return String(Number(this.pp.certificats || 0));
        },
        get ppCertificatsMin() {
            return this.pp.income_sources.includes('salaire') ? 1 : 0;
        },
        get ppIndependentIncomplete() {
            if (!this.pp.income_sources.includes('activite_independante')) return false;
            return this.pp.employees === '' || this.pp.employees === null
                || !(Number(this.pp.annual_revenue) > 0);
        },
        // Below CHF 100'000 of revenue, the accounting fee depends on how the
        // client hands over their bookkeeping (ready Excel file vs. raw documents
        // to sort) instead of the revenue matrix.
        get ppShowComptabiliteTransmission() {
            return this.pp.income_sources.includes('activite_independante')
                && Number(this.pp.annual_revenue) > 0
                && Number(this.pp.annual_revenue) < 100000;
        },
        syncCertificatsDefault() {
            this.$nextTick(() => {
                if (!this.pp.income_sources.includes('salaire')) {
                    this.pp.certificats = 0;
                    this.pp.certificats_edited = false;
                } else if (!this.pp.certificats_edited) {
                    this.pp.certificats = this.ppCertificatsMin;
                } else {
                    this.pp.certificats = Math.max(this.ppCertificatsMin, Number(this.pp.certificats || 0));
                }
            });
        },
        get ppDocsLabel() {
            const opt = this.docsStateOptions.find(o => o.value === this.pp.docs_state);
            return opt ? opt.label : this.pp.docs_state;
        },
        get ppRevenueDisplay() {
            const n = Number(this.pp.annual_revenue || 0);
            return n > 0 ? this.formatChf(n) : '';
        },
        formatPpRevenue(event) {
            const digits = event.target.value.replace(/[^0-9]/g, '').replace(/^0+/, '');
            this.pp.annual_revenue = digits === '' ? '' : Number(digits);
            event.target.value = this.ppRevenueDisplay;
        },

        // Flow sequences for each branch
        get currentFlow() {
            if (this.clientType === 'physique') return [1, 10, 2, 3, 4, 5, 6];
            if (this.isTransformation) return [1, 9, 7, 8];
            if (this.isCreation) return [1, 2, 3, 4, 7, 8];
            return [1, 3, 4, 5, 7, 8]; // existing
        },
        get displayStep() {
            if (typeof this.step !== 'number' || this.step === 0) return 0;
            const idx = this.currentFlow.indexOf(this.step);
            return idx === -1 ? 0 : idx + 1;
        },
        get totalSteps() {
            if (this.clientType === '') return 1;
            return this.currentFlow.length;
        },
        get progressPercent() {
            if (this.step === 'success' || this.step === 'error') return 100;
            if (this.step === 0) return 0;
            return Math.round((this.displayStep / this.totalSteps) * 100);
        },

        // ─── Helpers ────────────────────────────────────────────────────
        structureIcon(icon) {
            const icons = {
                person:         '<g><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></g>',
                corporate_fare: '<g><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></g>',
                apartment:      '<g><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></g>',
                add_business:    '<path d="M12 5v14M5 12h14"/>',
                transform:       '<path d="M4 12h16M14 6l6 6-6 6" stroke-linejoin="round"/>',
            };
            return icons[icon] || '';
        },
        structureMessage() {
            const messages = {
                independent: 'J\'ai une activité indépendante.',
                independant: 'J\'ai une activité indépendante.',
                sarl: 'J\'ai une Sàrl.',
                sa: 'J\'ai une SA.',
                creation: 'Je n\'ai pas encore de société. Nous nous chargeons du reste.',
                transformation: 'Je veux faire évoluer ma structure actuelle.',
            };
            return messages[this.fields.structure] || '';
        },
        situationLabel(v) {
            const opt = this.situationOptions.find(o => o.value === v);
            return opt ? opt.label : v;
        },
        situationPrice(v) {
            const prices = { tva: 'CHF 350', etranger: 'CHF 400', holding: 'CHF 600' };
            return prices[v] || '—';
        },
        creationServiceLabel(v) {
            const opt = this.creationServiceOptions.find(o => o.value === v);
            return opt ? opt.label : v;
        },
        creationCapitalText() {
            if (!this.fields.creation_type) return '';
            return this.fields.creation_type === 'creation-sarl'
                ? 'Capital minimum CHF 20\'000, libérable à 50% lors de la constitution.'
                : 'Capital minimum CHF 100\'000, dont CHF 50\'000 libérés à la constitution.';
        },
        creationServicePrice(v) {
            const prices = { domiciliation: `CHF ${this.formatChf(3000)}/an`, administrateur: `CHF ${this.formatChf(9500)}/an` };
            return prices[v] || '—';
        },
        serviceLabel(v) {
            const opt = this.currentServiceOptions.find(o => o.value === v);
            return opt ? opt.label : v;
        },
        servicePrice(v) {
            const opt = this.currentServiceOptions.find(o => o.value === v);
            if (!opt) return '—';
            return opt.detail || (opt.price !== null ? `${this.formatChf(opt.price)} CHF` : '—');
        },

        // ─── Init ───────────────────────────────────────────────────────
        init() {
            // Component initialized
        },

        // ─── Navigation ─────────────────────────────────────────────────
        selectClientType(type) {
            this.clientType = type;
        },

        clearFormError() { if (this.formError) this.formError = ''; },

        isValidEmail(email) {
            const v = (email || '').trim();
            if (v.length > 254) return false;
            return /^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)+$/.test(v);
        },

        isValidPhone(phone) {
            const stripped = (phone || '').replace(/[\s\-().+]/g, '');
            return /^\d{7,}$/.test(stripped);
        },

        formatPhoneNumber(event, target) {
            const digits = event.target.value.replace(/\D/g, '').slice(0, 9);
            // Regrupe en XX XXX XX XX (2-3-2-2 chiffres)
            const parts = [digits.slice(0, 2), digits.slice(2, 5), digits.slice(5, 7), digits.slice(7, 9)].filter(Boolean);
            this[target[0]][target[1]].phone = parts.join(' ');
        },

        formatRevenue(event) {
            const raw = event.target.value.replace(/[^0-9]/g, '');
            const normalized = raw.replace(/^0+/, '') || '0';
            this.fields.annualRevenue = normalized !== '0' ? Number(normalized) : (raw === '' ? '' : 0);
            this.revenueDisplay = normalized !== '0' ? normalized.replace(/\B(?=(\d{3})+(?!\d))/g, "'") : (raw === '' ? '' : '0');
        },

        normalizePositiveInt(value) {
            const digits = (value || '').replace(/[^0-9]/g, '');
            return parseInt(digits.replace(/^0+/, '') || '0', 10);
        },

        formatChf(value) {
            const n = Math.round(Number(value || 0));
            return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, "'");
        },

        // Mirrors BaseQuotation::money(): 1'150.00 CHF
        formatPdfChf(value) {
            const [int, dec] = Number(value || 0).toFixed(2).split('.');
            return int.replace(/\B(?=(\d{3})+(?!\d))/g, "'") + '.' + dec + ' CHF';
        },

        // Recap rows whose label ends in "(…)" (e.g. "Gestion RH & fiches de
        // salaire (2 employés inclus)") must never break INSIDE the parenthesis —
        // it moves to its own line as a whole instead of splitting across two.
        labelWithParenBreak(label) {
            const escaped = String(label || '')
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const idx = escaped.lastIndexOf(' (');
            if (idx === -1 || !escaped.endsWith(')')) return escaped;
            return escaped.slice(0, idx) + '<br>' + escaped.slice(idx + 1);
        },

        nextStep() {
            // Special case: Step 0 → Step 1 (or first step in current flow)
            if (this.step === 0) {
                this.step = 1;
                return;
            }
            if (this.clientType === 'moral' && this.step === 1
                && ['independent', 'independant'].includes(this.fields.structure)) {
                this.fields.structure = '';
                this.clientType = 'physique';
                this.step = 1;
                return;
            }
            const flow = this.currentFlow;
            const idx = flow.indexOf(this.step);
            if (idx !== -1 && idx < flow.length - 1) {
                this.step = flow[idx + 1];
                if (this.clientType === 'moral' && this.step === 8) {
                    this.loadPmPreview();
                }
                if (this.clientType === 'physique' && this.step === 6) {
                    this.loadPpPreview();
                }
            }
        },

        prevStep() {
            if (this.step === 1) {
                this.clientType = '';
                this.step = 0;
                return;
            }
            const flow = this.currentFlow;
            const idx = flow.indexOf(this.step);
            if (idx > 0) {
                this.step = flow[idx - 1];
            }
        },

        clearContactFields() {
            this.pp.name.first_name = '';
            this.pp.name.last_name = '';
            this.pp.name.phone = '';
            this.pp.email = '';
            this.pp.message = '';
            this.ppPhoneCountry = '+41';
            this.fields.name.first_name = '';
            this.fields.name.middle_name = '';
            this.fields.name.phone = '';
            this.fields.email = '';
            this.fields.company = '';
            this.fields.message = '';
            this.pmPhoneCountry = '+41';
        },

        // ─── PDF helpers ────────────────────────────────────────────────
        getPdfFilenameFromHeaders(contentDisposition, fallbackName) {
            if (!contentDisposition) return fallbackName;
            const utf8Match = contentDisposition.match(/filename\*=UTF-8''([^;]+)/i);
            if (utf8Match && utf8Match[1]) return decodeURIComponent(utf8Match[1]);
            const asciiMatch = contentDisposition.match(/filename="?([^";]+)"?/i);
            if (asciiMatch && asciiMatch[1]) return asciiMatch[1];
            return fallbackName;
        },

        async downloadPdfFromResponse(response, fallbackName) {
            const blob = await response.blob();
            const contentDisposition = response.headers.get('content-disposition');
            const filename = this.getPdfFilenameFromHeaders(contentDisposition, fallbackName);
            const blobUrl = window.URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = blobUrl;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            link.remove();
            window.setTimeout(() => window.URL.revokeObjectURL(blobUrl), 60000);
        },

        // ─── Submit — Personne Physique ─────────────────────────────────
        async submitIndividual() {
            this.formError = '';
            const p = this.pp;
            if (!p.name.first_name || !p.name.last_name || !p.email || !p.name.phone) {
                this.formError = 'Veuillez remplir tous les champs obligatoires.';
                return;
            }

            this.submitting = true;

            const payload = {
                fields: {
                    ...this.ppPricingFields(),
                    email: p.email,
                    website: this.honeypot,
                    altcha: this.altchaToken,
                    name: {
                        first_name: p.name.first_name,
                        last_name: p.name.last_name,
                        phone: this.ppPhoneCountry + ' ' + p.name.phone,
                    },
                    message: p.message,
                }
            };

            // Maquette : pas d'envoi d'e-mail ni de PDF (POST /quote/calculate-individual en ligne)
            await new Promise(resolve => setTimeout(resolve, 600));
            this.submitting = false;
            this.step = 'success';
        },

        ppPricingFields() {
            const p = this.pp;
            return {
                marital_status: p.marital_status,
                children: p.children,
                canton: p.canton,
                international: JSON.stringify(this.ppInternational),
                income_sources: JSON.stringify(p.income_sources),
                comptabilite_independante: p.comptabilite_independante,
                employees: p.employees,
                annual_revenue: p.annual_revenue,
                certificats: p.certificats,
                participation_count: p.participation_count,
                patrimoine: JSON.stringify(p.patrimoine),
                elements_particuliers: JSON.stringify(p.elements_particuliers),
                docs_state: p.docs_state,
            };
        },

        async loadPpPreview() {
            this.ppPreviewError = '';
            this.ppPreviewLoading = true;
            this.ppPreview = null;
            try {
                // Maquette : calcul local (POST /quote/preview-individual en ligne)
                const p = this.pp;
                this.ppPreview = PHI.individual({
                    ...this.ppPricingFields(),
                    international: this.ppInternational,
                    income_sources: p.income_sources,
                    patrimoine: p.patrimoine,
                    elements_particuliers: p.elements_particuliers,
                });
            } catch (e) {
                this.ppPreviewError = 'Une erreur réseau est survenue.';
            } finally {
                this.ppPreviewLoading = false;
            }
        },

        async loadPmPreview() {
            this.pmPreviewError = '';
            this.pmPreviewLoading = true;
            const f = this.fields;

            let payload;
            if (this.isTransformation) {
                payload = {
                    fields: {
                        structure: 'transformation',
                        transformation_type: f.transformation_type,
                    }
                };
            } else if (this.isCreation) {
                payload = {
                    fields: {
                        structure: 'creation',
                        creation_type: f.creation_type,
                        situations: JSON.stringify(f.situation_entreprise),
                        'services-creation': JSON.stringify(f.services_creation),
                    }
                };
            } else {
                payload = {
                    fields: {
                        structure: f.structure,
                        services: JSON.stringify(f.services),
                        employees: String(f.employees || 0),
                        annualRevenue: String(f.annualRevenue || 0),
                    }
                };
            }

            try {
                // Maquette : calcul local (POST /quote/preview-company en ligne)
                const pf = payload.fields;
                if (this.isTransformation) {
                    this.pmPreview = PHI.transformation({ transformation_type: pf.transformation_type });
                } else if (this.isCreation) {
                    this.pmPreview = PHI.creation({
                        creation_type: pf.creation_type,
                        situations: f.situation_entreprise,
                        services: f.services_creation,
                    });
                } else {
                    this.pmPreview = PHI.existingCompany({
                        services: f.services,
                        employees: pf.employees,
                        annualRevenue: pf.annualRevenue,
                    });
                }
            } catch (e) {
                this.pmPreviewError = 'Une erreur réseau est survenue.';
                this.pmPreview = null;
            } finally {
                this.pmPreviewLoading = false;
            }
        },

        // ─── Submit — Personne Morale ───────────────────────────────────
        async submitMoral() {
            this.formError = '';
            const f = this.fields;
            if (!f.name.first_name || !f.name.middle_name || !f.email || !f.name.phone) {
                this.formError = 'Veuillez remplir tous les champs obligatoires.';
                return;
            }

            this.submitting = true;
            const pmPhone = this.pmPhoneCountry + ' ' + f.name.phone;

            let payload;

            if (this.isTransformation) {
                payload = {
                    fields: {
                        structure: 'transformation',
                        transformation_type: f.transformation_type,
                        name: { ...f.name, phone: pmPhone },
                        email: f.email,
                        company: f.company,
                        message: f.message,
                        website: this.honeypot,
                        altcha: this.altchaToken,
                    }
                };
            } else if (this.isCreation) {
                payload = {
                    fields: {
                        structure: f.structure,
                        creation_type: f.creation_type,
                        situations: JSON.stringify(f.situation_entreprise),
                        'services-creation': JSON.stringify(f.services_creation),
                        name: { ...f.name, phone: pmPhone },
                        email: f.email,
                        company: f.company,
                        message: f.message,
                        website: this.honeypot,
                        altcha: this.altchaToken,
                    }
                };
            } else {
                payload = {
                    fields: {
                        structure: f.structure,
                        services: JSON.stringify(f.services),
                        employees: String(f.employees),
                        annualRevenue: String(f.annualRevenue),
                        name: { ...f.name, phone: pmPhone },
                        email: f.email,
                        company: f.company,
                        website: this.honeypot,
                        altcha: this.altchaToken,
                    }
                };
            }

            // Maquette : pas d'envoi d'e-mail ni de PDF (POST /quote/calculate en ligne)
            await new Promise(resolve => setTimeout(resolve, 600));
            this.submitting = false;
            this.step = 'success';
        },
    };
}
</script>
